# SystemG: the session's environment, as pam_systemd sets it. With the bus
# address known at login, display managers and desktops use the per-user
# session bus (SystemG's user manager) instead of starting a private one.
# Priority -10 in /usr/share/pam-configs/systemg-user puts this after
# pam_elogind, which sets XDG_RUNTIME_DIR.
DBUS_SESSION_BUS_ADDRESS DEFAULT=unix:path=${XDG_RUNTIME_DIR}/bus
